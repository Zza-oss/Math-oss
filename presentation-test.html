<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MathSpace Presentation Test</title>

    <link rel="stylesheet" href="css/style.css" />

    <!-- MathJax Configuration -->
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [["\\(", "\\)"]],
          displayMath: [["\\[", "\\]"]],
        },
        startup: {
          typeset: false,
        },
      };
    </script>

    <!-- MathJax Library -->
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js"
    ></script>
  </head>

  <body class="presentation-test-page">
    <main id="presentation-preview"></main>

    <nav class="presentation-navigation" aria-label="Navigasi presentasi">
      <div class="presentation-navigation__inner">
        <!-- Progress -->
        <div
          class="presentation-progress"
          role="progressbar"
          aria-label="Progres presentasi"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div id="presentation-progress-fill"></div>
        </div>

        <!-- Navigation Controls -->
        <div class="presentation-controls">
          <button
            id="question-list-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="question-list-panel"
          >
            <span aria-hidden="true">☷</span>
            Daftar Soal
          </button>

          <div class="presentation-controls__right">
            <button
              id="previous-slide"
              type="button"
              aria-label="Slide sebelumnya"
            >
              Previous
            </button>

            <span id="slide-counter" aria-live="polite"> 0 / 0 </span>

            <button id="next-slide" type="button" aria-label="Slide berikutnya">
              Next
            </button>
          </div>
        </div>

        <!-- Question List Panel -->
        <div id="question-list-panel" class="question-list-panel" hidden>
          <h2>Daftar Soal</h2>
          <p>Pilih soal yang ingin dipelajari.</p>

          <div id="question-list"></div>
        </div>
      </div>
    </nav>

    <script type="module">
      import { assessment02 } from "./js/data/assessment-02.js";

      import { renderPresentation } from "./js/components/presentationRenderer.js";

      import { initPresentationNavigation } from "./js/components/presentationNavigation.js";

      await window.MathJax.startup.promise;

      const container = document.querySelector("#presentation-preview");

      const slides = await renderPresentation(assessment02, container);

      const navigation = initPresentationNavigation(slides, {
        previousButton: document.querySelector("#previous-slide"),
        nextButton: document.querySelector("#next-slide"),
        counter: document.querySelector("#slide-counter"),
        progressFill: document.querySelector("#presentation-progress-fill"),

        // Navigation baru
        questionButton: document.querySelector("#question-list-toggle"),
        questionPanel: document.querySelector("#question-list-panel"),
        questionList: document.querySelector("#question-list"),
      });

      window.mathSpaceNavigation = navigation;

      // =================================
      // DYNAMIC BOTTOM NAVIGATION CLEARANCE
      // =================================

      const fixedNavigation = document.querySelector(
        ".presentation-navigation",
      );

      const presentationPage = document.querySelector(
        ".presentation-test-page",
      );

      function syncNavigationSpace() {
        if (!fixedNavigation || !presentationPage) return;

        // Ukur tinggi navigasi yang sebenarnya
        const navigationHeight = fixedNavigation.getBoundingClientRect().height;

        // Tambahkan ruang ekstra agar konten tidak menempel
        const clearance = Math.ceil(navigationHeight + 28);

        presentationPage.style.paddingBottom = `${clearance}px`;

        // Membantu scroll dan navigasi fokus
        document.documentElement.style.scrollPaddingBottom = `${clearance}px`;
      }

      // Hitung saat halaman dimuat
      syncNavigationSpace();

      // Hitung ulang jika tinggi navigasi berubah
      if ("ResizeObserver" in window) {
        const navigationObserver = new ResizeObserver(syncNavigationSpace);

        navigationObserver.observe(fixedNavigation);
      }

      // Hitung ulang saat ukuran layar berubah
      window.addEventListener("resize", syncNavigationSpace, { passive: true });

      // Menampilkan daftar slide di Console
      slides.forEach((slide, index) => {
        console.log(
          index + 1,
          slide.dataset.slideId,
          slide.querySelector("h2")?.textContent,
        );
      });
    </script>
  </body>
</html>
