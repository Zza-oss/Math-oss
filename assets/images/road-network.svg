
<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 900 340"
    role="img"
    aria-labelledby="title desc"
>
    <title id="title">Jaringan Jalan Kota A, B, dan C</title>

    <desc id="desc">
        Lima jalan menghubungkan Kota A dan B.
        Tiga jalan menghubungkan Kota B dan C.
    </desc>

    <defs>
        <style>
            .road {
                fill: none;
                stroke: #64748b;
                stroke-width: 3;
                stroke-linecap: round;
            }

            .road-label {
                font: 600 24px sans-serif;
                fill: currentColor;
                text-anchor: middle;
            }

            .city {
                fill: #b8eee8;
                stroke: #368e89;
                stroke-width: 2;
            }

            .city-label {
                font: 700 25px sans-serif;
                fill: #164e4a;
                text-anchor: middle;
                dominant-baseline: middle;
            }
        </style>
    </defs>

    <!-- Roads: A to B -->

    <path class="road"
        d="M 160 170 C 215 35, 335 35, 390 170"/>

    <path class="road"
        d="M 160 170 C 220 85, 330 85, 390 170"/>

    <path class="road"
        d="M 160 170 L 390 170"/>

    <path class="road"
        d="M 160 170 C 220 255, 330 255, 390 170"/>

    <path class="road"
        d="M 160 170 C 215 305, 335 305, 390 170"/>

    <!-- Labels: A to B -->

    <text class="road-label" x="275" y="48">1</text>
    <text class="road-label" x="275" y="98">2</text>
    <text class="road-label" x="275" y="158">3</text>
    <text class="road-label" x="275" y="248">4</text>
    <text class="road-label" x="275" y="300">5</text>

    <!-- Roads: B to C -->

    <path class="road"
        d="M 510 170 C 565 75, 675 75, 730 170"/>

    <path class="road"
        d="M 510 170 L 730 170"/>

    <path class="road"
        d="M 510 170 C 565 265, 675 265, 730 170"/>

    <!-- Labels: B to C -->

    <text class="road-label" x="620" y="93">x</text>
    <text class="road-label" x="620" y="158">y</text>
    <text class="road-label" x="620" y="252">z</text>

    <!-- City nodes -->

    <rect class="city"
        x="30" y="140"
        width="130" height="60"
        rx="22"/>

    <rect class="city"
        x="390" y="140"
        width="120" height="60"
        rx="22"/>

    <rect class="city"
        x="730" y="140"
        width="130" height="60"
        rx="22"/>

    <!-- City labels -->

    <text class="city-label" x="95" y="170">A</text>
    <text class="city-label" x="450" y="170">B</text>
    <text class="city-label" x="795" y="170">C</text>

</svg>
